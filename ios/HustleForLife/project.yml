name: HustleForLife
options:
  bundleIdPrefix: com.hustleforlife
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  HustleForLife:
    type: application
    platform: iOS
    sources:
      - path: HustleForLife
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: HustleForLife/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hustleforlife.app
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: HustleForLife/HustleForLife.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  HustleForLifeWatch:
    type: application
    platform: watchOS
    sources:
      - path: HustleForLifeWatch
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hustleforlife.app.watchkitapp
        INFOPLIST_FILE: HustleForLifeWatch/Info.plist
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    dependencies:
      - target: HustleForLife
        embed: false

schemes:
  HustleForLife:
    build:
      targets:
        HustleForLife: all
        HustleForLifeWatch: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
