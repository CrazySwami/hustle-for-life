version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hustle-life-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hustle_life}
      POSTGRES_USER: ${POSTGRES_USER:-hustle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - ${DATA_PATH:-./data}:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hustle} -d ${POSTGRES_DB:-hustle_life}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for web-based management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hustle-life-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hustle.life}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "${PGADMIN_PORT:-5050}:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - admin  # Only start with: docker-compose --profile admin up

volumes:
  pgadmin_data:

# Networks (optional, for isolation)
networks:
  default:
    name: hustle-life-network
