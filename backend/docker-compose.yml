# Hustle For Life - Docker Compose Configuration
#
# Runs the backend server alongside PostgreSQL database.
# Use with: docker-compose up -d

version: '3.8'

services:
  # Backend server (Claude Code wrapper)
  backend:
    build: .
    container_name: hustle-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Persist department directories and data
      - hustle-data:/home/alfonso/hustle
      # Persist Claude Code session data and credentials
      - claude-data:/root/.claude
      # Allow mounting local department folders for development
      - ${LOCAL_HUSTLE_ROOT:-./departments}:/home/alfonso/hustle:rw
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HUSTLE_ROOT=/home/alfonso/hustle
      - HEALTH_DATA_DIR=/home/alfonso/hustle/health/data
      - DATABASE_URL=postgresql://hustle:${POSTGRES_PASSWORD}@postgres:5432/hustle_life
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hustle-network

  # PostgreSQL database (for additional structured data storage)
  postgres:
    image: postgres:16-alpine
    container_name: hustle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hustle_life}
      POSTGRES_USER: ${POSTGRES_USER:-hustle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hustle} -d ${POSTGRES_DB:-hustle_life}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hustle-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hustle-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hustle.life}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "${PGADMIN_PORT:-5050}:5050"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - admin  # Only start with: docker-compose --profile admin up
    networks:
      - hustle-network

volumes:
  hustle-data:
    name: hustle-departments
  claude-data:
    name: hustle-claude-sessions
  postgres-data:
    name: hustle-postgres-data
  pgadmin-data:
    name: hustle-pgadmin-data

networks:
  hustle-network:
    name: hustle-network
    driver: bridge
